<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Quantization Vector Model</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      padding: 24px;
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      text-align: center;
    }
    .header h1 { font-size: 1.5rem; font-weight: 600; color: #38bdf8; }
    .header p { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 12px 20px;
      border-radius: 8px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    label { font-weight: 500; font-size: 0.95rem; }
    input[type=range] {
      cursor: pointer;
      accent-color: #38bdf8;
    }
    .val-display {
      font-weight: 700;
      color: #38bdf8;
      min-width: 24px;
    }
    canvas {
      width: 100%;
      height: 480px;
      background: #0b1120;
      border-radius: 8px;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: center;
    }
    .stat-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .stat-value { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; margin-top: 2px; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Space Quantization Vector Model</h1>
    <p>Orbital Angular Momentum Quantization in a Magnetic Field (Z-Axis)</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="lSlider">Quantum Number (l):</label>
      <input type="range" id="lSlider" min="1" max="4" step="1" value="2">
      <span class="val-display" id="lVal">2</span>
    </div>
    <div class="control-group">
      <label><input type="checkbox" id="precessCheck" checked> Precession Animation</label>
    </div>
  </div>

  <canvas id="stage"></canvas>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label">Total Magnitude |L|</div>
      <div class="stat-value" id="magVal">√6 ℏ ≈ 2.45 ℏ</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Allowed Orientations</div>
      <div class="stat-value" id="orientVal">5 states</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Projections (m_l)</div>
      <div class="stat-value" id="projVal">-2, -1, 0, +1, +2</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const lSlider = document.getElementById('lSlider');
  const lVal = document.getElementById('lVal');
  const precessCheck = document.getElementById('precessCheck');
  const magVal = document.getElementById('magVal');
  const orientVal = document.getElementById('orientVal');
  const projVal = document.getElementById('projVal');

  let l = parseInt(lSlider.value);
  let phi = 0;
  let rotX = 0.2;
  let rotY = 0.4;
  let isDragging = false;
  let lastMouse = { x: 0, y: 0 };

  function resizeCanvas() {
    canvas.width = canvas.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.clientHeight * window.devicePixelRatio;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  canvas.addEventListener('mousedown', e => {
    isDragging = true;
    lastMouse = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('mouseup', () => isDragging = false);

  canvas.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastMouse.x;
    const dy = e.clientY - lastMouse.y;
    rotY += dx * 0.008;
    rotX += dy * 0.008;
    lastMouse = { x: e.clientX, y: e.clientY };
  });

  lSlider.addEventListener('input', (e) => {
    l = parseInt(e.target.value);
    lVal.textContent = l;
    updateStats();
  });

  function updateStats() {
    const mag = Math.sqrt(l * (l + 1)).toFixed(2);
    magVal.textContent = `√${l*(l+1)} ℏ ≈ ${mag} ℏ`;
    orientVal.textContent = `${2 * l + 1} states`;
    let projs = [];
    for (let m = -l; m <= l; m++) projs.push(m > 0 ? `+${m}` : `${m}`);
    projVal.textContent = projs.join(', ');
  }
  updateStats();

  function project(x, y, z) {
    let x1 = x * Math.cos(rotY) + z * Math.sin(rotY);
    let z1 = -x * Math.sin(rotY) + z * Math.cos(rotY);
    let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
    let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);

    const scale = canvas.height / 10;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    return {
      x: cx + x1 * scale,
      y: cy - y2 * scale,
      depth: z2
    };
  }

  function drawArrow(p1, p2, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const headLen = 10;
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y);
    ctx.lineTo(p2.x - headLen * Math.cos(angle - Math.PI / 6), p2.y - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(p2.x - headLen * Math.cos(angle + Math.PI / 6), p2.y - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (precessCheck.checked) phi += 0.02;

    const L_mag = Math.sqrt(l * (l + 1));
    const scaleFactor = 3.5 / L_mag;
    const origin = project(0, 0, 0);

    // Draw Z Axis (Magnetic Field)
    const zTop = project(0, (L_mag + 0.8) * scaleFactor, 0);
    const zBot = project(0, -(L_mag + 0.8) * scaleFactor, 0);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(zBot.x, zBot.y);
    ctx.lineTo(zTop.x, zTop.y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText("B (Z-Axis)", zTop.x + 10, zTop.y);

    const colors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8', '#818cf8', '#c084fc'];

    for (let m = -l; m <= l; m++) {
      const zVal = m * scaleFactor;
      const radius = Math.sqrt(Math.max(0, L_mag * L_mag - m * m)) * scaleFactor;
      const col = colors[(m + l) % colors.length];

      // Precession Circle
      ctx.strokeStyle = col;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      for (let a = 0; a <= Math.PI * 2; a += 0.1) {
        const pt = project(radius * Math.cos(a), zVal, radius * Math.sin(a));
        if (a === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.closePath();
      ctx.stroke();

      // Horizontal projection line to Z-axis
      const zProjPt = project(0, zVal, 0);
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(zProjPt.x, zProjPt.y);
      const currentTip = project(radius * Math.cos(phi + m), zVal, radius * Math.sin(phi + m));
      ctx.lineTo(currentTip.x, currentTip.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Label projection
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = col;
      ctx.font = '12px sans-serif';
      ctx.fillText(`m_l = ${m > 0 ? '+' + m : m}`, zProjPt.x - 45, zProjPt.y + 4);

      // Draw Vector Arrow
      ctx.globalAlpha = 1.0;
      drawArrow(origin, currentTip, col);
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
